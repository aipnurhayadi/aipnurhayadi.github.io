---
layout: default
---

<main class="min-h-screen bg-background text-foreground">
  <div class="mx-auto max-w-2xl px-6 py-24 sm:px-8 sm:py-32">
    
    <div class="mb-24">
      <a href="{{ '/' | relative_url }}" class="inline-flex items-center gap-2 text-sm font-medium text-muted-foreground transition-colors hover:text-foreground">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Kembali
      </a>
    </div>

    <article class="fade-in-section space-y-8">
      <header class="space-y-4">
        <h1 class="font-display text-4xl font-medium tracking-tight sm:text-5xl">
          {{ page.title }}
        </h1>
        <p class="text-lg text-muted-foreground">
          {{ page.category }} — {{ page.year }}
        </p>
      </header>
      
      <div class="prose prose-neutral dark:prose-invert max-w-none">
        {{ content }}
      </div>
    </article>

  </div>
</main>
